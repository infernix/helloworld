[package]
name = "helloworld"
version = "0.1.0"
edition = "2021"
rust-version = "1.74"
description = "Multilingual hello-world HTTP server with zero dependencies"
license = "MIT"
readme = "README.md"
keywords = ["http-server", "i18n", "hello-world", "multilingual", "cli"]
categories = ["web-programming::http-server", "command-line-utilities"]

[[bin]]
name = "helloworld"
path = "src/main.rs"

[profile.release]
lto = true
codegen-units = 1
strip = true

[lints.rust]
unsafe_code = "forbid"
missing_docs = "deny"
